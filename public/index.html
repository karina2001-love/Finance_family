<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Наши финансы</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<section id="login" class="login hidden">
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="seed">🌱</div>
    <h1>Наши финансы</h1>
    <p>Только для своих</p>
    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" autofocus>
    <button class="btn primary" type="submit">Войти</button>
    <div id="loginErr" class="err"></div>
  </form>
</section>

<main id="app" class="hidden">
  <header class="top">
    <div>
      <h1>Наши финансы</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="top-actions">
      <button class="rate-chip" id="rateChip" title="Обновить курс">…</button>
      <span id="saveState" class="save"></span>
      <button class="icon-btn" id="btnSettings" title="Настройки">⚙︎</button>
      <button class="icon-btn" id="btnLogout" title="Выйти">⎋</button>
    </div>
  </header>
  <div id="banner"></div>
  <div id="dash"></div>
</main>

<div id="overlay" class="overlay"></div>
<aside id="drawer" class="drawer" aria-hidden="true"></aside>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
